<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample HTML Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #222;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fff;
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    h1 { margin-top: 0; }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    input {
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 60%;
    }
    #greeting, #count { margin-top: 1rem; font-weight: 600; }
    hr { margin: 1.5rem 0; border: none; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>This is a sample page with HTML, CSS, and JavaScript.</p>

    <input id="name" type="text" placeholder="Enter your name">
    <button onclick="greet()">Greet</button>
    <div id="greeting"></div>

    <hr>

    <button onclick="increment()">Click me</button>
    <div id="count">Clicks: 0</div>
  </div>

  <script>
    function greet() {
      const name = document.getElementById("name").value.trim() || "stranger";
      document.getElementById("greeting").textContent = "Hello, " + name + "! 👋";
    }

    let clicks = 0;
    function increment() {
      clicks++;
      document.getElementById("count").textContent = "Clicks: " + clicks;
    }
  </script>
</body>
</html>
